<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet Ledger System — Dashboard</title>
    <!-- React 18 UMD + Babel for standalone demo (no build step required) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --border: #334155;
            --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
            --green: #22c55e; --red: #ef4444; --yellow: #eab308;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
        h1 span { color: var(--accent); }
        .subtitle { color: var(--muted); margin-bottom: 32px; font-size: 0.95rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .card h2 { font-size: 1.1rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .card h2 .icon { font-size: 1.3rem; }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
        input, select { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: var(--accent); }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 16px; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-green { background: var(--green); color: #fff; }
        .btn-green:hover { background: #16a34a; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .wallet-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .wallet-name { font-weight: 600; font-size: 1rem; }
        .wallet-id { color: var(--muted); font-size: 0.8rem; }
        .wallet-balance { font-size: 1.3rem; font-weight: 700; color: var(--green); }
        .wallet-currency { color: var(--muted); font-size: 0.85rem; margin-left: 4px; }
        .alert { padding: 12px 16px; border-radius: 8px; margin-top: 16px; font-size: 0.9rem; }
        .alert-success { background: rgba(34,197,94,0.15); border: 1px solid var(--green); color: var(--green); }
        .alert-error { background: rgba(239,68,68,0.15); border: 1px solid var(--red); color: var(--red); }
        .alert-warning { background: rgba(234,179,8,0.15); border: 1px solid var(--yellow); color: var(--yellow); }
        .ledger-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.85rem; }
        .ledger-table th { text-align: left; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 600; }
        .ledger-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
        .badge-debit { background: rgba(239,68,68,0.2); color: var(--red); }
        .badge-credit { background: rgba(34,197,94,0.2); color: var(--green); }
        .txn-ref { font-family: monospace; color: var(--accent); font-size: 0.8rem; }
        .empty { text-align: center; color: var(--muted); padding: 32px; font-size: 0.95rem; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const API = "http://localhost:8080/api/v1";

        // ───────────── Utility: Generate a unique idempotency key ─────────────
        const genKey = () => `txn-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

        // ───────────── Main App Component ─────────────
        function App() {
            const [wallets, setWallets] = React.useState([]);
            const [ledger, setLedger] = React.useState([]);
            const [selectedLedgerWallet, setSelectedLedgerWallet] = React.useState(null);
            const [alert, setAlert] = React.useState(null);

            // Create Wallet form state
            const [newName, setNewName] = React.useState("");
            const [newBalance, setNewBalance] = React.useState("100.00");

            // Transfer form state
            const [srcId, setSrcId] = React.useState("");
            const [dstId, setDstId] = React.useState("");
            const [amount, setAmount] = React.useState("");
            const [desc, setDesc] = React.useState("");
            const [loading, setLoading] = React.useState(false);

            const showAlert = (type, message) => {
                setAlert({ type, message });
                setTimeout(() => setAlert(null), 6000);
            };

            // Fetch wallets on mount and after mutations
            const fetchWallets = async () => {
                try {
                    const res = await fetch(`${API}/wallets`);
                    if (res.ok) setWallets(await res.json());
                } catch (e) { console.error("Failed to fetch wallets", e); }
            };

            React.useEffect(() => { fetchWallets(); }, []);

            // Create Wallet
            const handleCreateWallet = async (e) => {
                e.preventDefault();
                if (!newName.trim()) return;
                try {
                    const res = await fetch(`${API}/wallets`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ ownerName: newName, initialBalance: parseFloat(newBalance), currency: "USD" }),
                    });
                    if (res.ok) {
                        const w = await res.json();
                        showAlert("success", `Wallet created for "${w.ownerName}" (ID: ${w.id})`);
                        setNewName(""); setNewBalance("100.00");
                        fetchWallets();
                    } else {
                        const err = await res.json();
                        showAlert("error", err.message || "Failed to create wallet");
                    }
                } catch (e) { showAlert("error", e.message); }
            };

            // Transfer
            const handleTransfer = async (e) => {
                e.preventDefault();
                if (!srcId || !dstId || !amount) return;
                setLoading(true);
                try {
                    const res = await fetch(`${API}/transfers`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-Idempotency-Key": genKey(),
                        },
                        body: JSON.stringify({
                            sourceWalletId: parseInt(srcId),
                            destinationWalletId: parseInt(dstId),
                            amount: parseFloat(amount),
                            description: desc || "Wallet transfer",
                        }),
                    });
                    const data = await res.json();
                    if (res.ok) {
                        showAlert("success", `Transfer complete! Ref: ${data.transactionReference} — Source balance: $${data.sourceBalanceAfter}, Dest balance: $${data.destinationBalanceAfter}`);
                        setAmount(""); setDesc("");
                        fetchWallets();
                        if (selectedLedgerWallet) fetchLedger(selectedLedgerWallet);
                    } else {
                        showAlert("error", data.message || "Transfer failed");
                    }
                } catch (e) { showAlert("error", e.message); }
                setLoading(false);
            };

            // Fetch ledger
            const fetchLedger = async (walletId) => {
                setSelectedLedgerWallet(walletId);
                try {
                    const res = await fetch(`${API}/wallets/${walletId}/ledger`);
                    if (res.ok) setLedger(await res.json());
                } catch (e) { console.error(e); }
            };

            return (
                <div className="container">
                    <h1>💰 <span>Wallet Ledger</span> System</h1>
                    <p className="subtitle">Distributed double-entry atomic ledger with idempotent transfers</p>

                    {alert && <div className={`alert alert-${alert.type}`}>{alert.message}</div>}

                    <div className="grid" style={{ marginTop: 20 }}>
                        {/* ── Create Wallet Card ── */}
                        <div className="card">
                            <h2><span className="icon">🏦</span> Create Wallet</h2>
                            <form onSubmit={handleCreateWallet}>
                                <label>Owner Name</label>
                                <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="e.g. Alice Johnson" required />
                                <label>Initial Balance (USD)</label>
                                <input type="number" step="0.01" min="0" value={newBalance} onChange={e => setNewBalance(e.target.value)} required />
                                <button type="submit" className="btn btn-primary">➕ Create Wallet</button>
                            </form>
                        </div>

                        {/* ── Transfer Funds Card ── */}
                        <div className="card">
                            <h2><span className="icon">🔄</span> Transfer Funds</h2>
                            <form onSubmit={handleTransfer}>
                                <label>Source Wallet ID</label>
                                <input type="number" min="1" value={srcId} onChange={e => setSrcId(e.target.value)} placeholder="e.g. 1" required />
                                <label>Destination Wallet ID</label>
                                <input type="number" min="1" value={dstId} onChange={e => setDstId(e.target.value)} placeholder="e.g. 2" required />
                                <label>Amount (USD)</label>
                                <input type="number" step="0.01" min="0.01" value={amount} onChange={e => setAmount(e.target.value)} placeholder="250.00" required />
                                <label>Description (optional)</label>
                                <input value={desc} onChange={e => setDesc(e.target.value)} placeholder="Payment for services" />
                                <button type="submit" className="btn btn-green" disabled={loading}>
                                    {loading ? <><span className="spinner"></span> Processing...</> : "⚡ Send Transfer"}
                                </button>
                            </form>
                        </div>
                    </div>

                    {/* ── Wallets List ── */}
                    <div className="card">
                        <h2><span className="icon">📋</span> Wallets <button className="btn btn-primary" style={{ marginTop: 0, marginLeft: "auto", padding: "6px 14px", fontSize: "0.8rem" }} onClick={fetchWallets}>↻ Refresh</button></h2>
                        {wallets.length === 0 ? (
                            <div className="empty">No wallets yet. Create one above!</div>
                        ) : wallets.map(w => (
                            <div className="wallet-card" key={w.id}>
                                <div>
                                    <div className="wallet-name">{w.ownerName}</div>
                                    <div className="wallet-id">Wallet #{w.id}</div>
                                </div>
                                <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
                                    <div>
                                        <span className="wallet-balance">${parseFloat(w.balance).toFixed(2)}</span>
                                        <span className="wallet-currency">{w.currency}</span>
                                    </div>
                                    <button className="btn btn-primary" style={{ marginTop: 0, padding: "6px 14px", fontSize: "0.8rem" }} onClick={() => fetchLedger(w.id)}>📒 Ledger</button>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* ── Ledger Table ── */}
                    {selectedLedgerWallet && (
                        <div className="card" style={{ marginTop: 20 }}>
                            <h2><span className="icon">📒</span> Ledger — Wallet #{selectedLedgerWallet}</h2>
                            {ledger.length === 0 ? (
                                <div className="empty">No ledger entries yet for this wallet.</div>
                            ) : (
                                <table className="ledger-table">
                                    <thead><tr><th>Ref</th><th>Type</th><th>Amount</th><th>Before</th><th>After</th><th>Counterpart</th><th>Description</th></tr></thead>
                                    <tbody>
                                        {ledger.map(e => (
                                            <tr key={e.id}>
                                                <td><span className="txn-ref">{e.transactionReference}</span></td>
                                                <td><span className={`badge badge-${e.entryType.toLowerCase()}`}>{e.entryType}</span></td>
                                                <td>${parseFloat(e.amount).toFixed(2)}</td>
                                                <td>${parseFloat(e.balanceBefore).toFixed(2)}</td>
                                                <td>${parseFloat(e.balanceAfter).toFixed(2)}</td>
                                                <td>#{e.counterpartWalletId}</td>
                                                <td>{e.description || "—"}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
