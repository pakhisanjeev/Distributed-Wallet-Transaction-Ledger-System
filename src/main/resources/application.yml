server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wallet_ledger_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always

logging:
  level:
    com.walletledger: DEBUG
